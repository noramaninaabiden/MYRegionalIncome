version: 2

models:
  - name: fct_state_socioeconomic
    columns:
      - name: state
        tests:
          - not_null
          - relationships:
              to: ref('dim_state')
              field: state
      - name: state_code
        tests:
          - not_null
      - name: year
        tests:
          - not_null
      - name: income_mean
        tests:
          - not_null
      - name: real_income_mean
        tests:
          - not_null

  - name: dim_state
    columns:
      - name: state
        tests:
          - unique
          - not_null
      - name: state_code
        tests:
          - unique
          - not_null